apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerceproductapi-deployment
  labels:
    app: ecommerceproductapi
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ecommerceproductapi
  template:
    metadata:
      labels:
        app: ecommerceproductapi
    spec:
      containers:
      - name: ecommerceproductapi
        image: amit728/ecommerceproductapi:1.0.0
        ports:
        - containerPort: 5001
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://*:5001"
        - name: CONNECTIONSTRINGS__PRODUCTDBCONNECTION
          value: "Server=mssql;Database=ProductDb;User=sa;Password=@Password12;TrustServerCertificate=True;"
        - name: SERVICEURLS__INVENTORYENDPOINT
          value: "http://inventory-api"
        - name: SERVICEURLS__PRODUCTDETAILENDPOINT
          value: "http://product-detail-api"
        - name: EUREKA__CLIENT__SERVICEURL
          value: "http://eureka-server:8761/eureka/"
        - name: EUREKA__INSTANCE__APPNAME
          value: "product-api"
        - name: EUREKA__INSTANCE__PORT
          value: "5001"
        - name: RABBITMQ__HOSTNAME
          value: "rabbitmq"
        - name: RABBITMQ__PORT
          value: "5672"
        - name: RABBITMQ__USERNAME
          value: "guest"
        - name: RABBITMQ__PASSWORD
          value: "guest"
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerceproductapi-service
spec:
  selector:
    app: ecommerceproductapi
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001
  type: ClusterIP