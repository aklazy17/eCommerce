apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerceproductapi-deployment
  labels:
    app: ecommerceproductapi
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ecommerceproductapi
  template:
    metadata:
      labels:
        app: ecommerceproductapi
    spec:
      containers:
      - name: ecommerceproductapi
        image: amit728/ecommerceproductapi:1.0.0
        ports:
        - containerPort: 5001
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: common-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ASPNETCORE_URLS
          value: "http://*:5001"
        - name: CONNECTIONSTRINGS__PRODUCTDBCONNECTION
          value: "Server=mssql;Database=ProductDb;User=sa;Password=@Password12;TrustServerCertificate=True;"
        - name: SERVICEURLS__INVENTORYENDPOINT
          value: "http://inventory-api"
        - name: SERVICEURLS__PRODUCTDETAILENDPOINT
          value: "http://product-detail-api"
        - name: EUREKA__CLIENT__SERVICEURL
          valueFrom:
            configMapKeyRef:
              name: eureka-config
              key: EUREKA__CLIENT__SERVICEURL
        - name: EUREKA__CLIENT__SHOULDFETCHREGISTRY
          value: "true"
        - name: EUREKA__CLIENT__SHOULDREGISTERWITHEUREKA
          value: "true"
        - name: EUREKA__INSTANCE__IPADDRESS
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: EUREKA__INSTANCE__PREFERIPADDRESS
          value: "true"
        - name: EUREKA__INSTANCE__APPNAME
          value: "product-api"
        - name: EUREKA__INSTANCE__PORT
          value: "5001"
        - name: RABBITMQ__HOSTNAME
          valueFrom:
            configMapKeyRef:
              name: rabbitmq-config
              key: RABBITMQ__HOSTNAME
        - name: RABBITMQ__PORT
          valueFrom:
            configMapKeyRef:
              name: rabbitmq-config
              key: RABBITMQ__PORT
        - name: RABBITMQ__USERNAME
          valueFrom:
            configMapKeyRef:
              name: rabbitmq-config
              key: RABBITMQ__USERNAME
        - name: RABBITMQ__PASSWORD
          valueFrom:
            configMapKeyRef:
              name: rabbitmq-config
              key: RABBITMQ__PASSWORD
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerceproductapi-service
spec:
  selector:
    app: ecommerceproductapi
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5001
  type: ClusterIP