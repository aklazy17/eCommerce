apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerceinventoryapi-deployment
  labels:
    app: ecommerceinventoryapi
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ecommerceinventoryapi
  template:
    metadata:
      labels:
        app: ecommerceinventoryapi
    spec:
      containers:
      - name: ecommerceinventoryapi
        image: amit728/ecommerceinventoryapi:1.0.0
        ports:
        - containerPort: 5003
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://*:5003"
        - name: CONNECTIONSTRINGS__INVENTORYDBCONNECTION
          value: "Server=mssql;Database=InventoryDb;User=sa;Password=@Password12;TrustServerCertificate=True;"
        - name: EUREKA__CLIENT__SERVICEURL
          value: "http://eureka-server:8761/eureka/"
        - name: EUREKA__INSTANCE__APPNAME
          value: "inventory-api"
        - name: EUREKA__INSTANCE__PORT
          value: "5003"
        - name: RABBITMQ__HOSTNAME
          value: "rabbitmq"
        - name: RABBITMQ__PORT
          value: "5672"
        - name: RABBITMQ__USERNAME
          value: "guest"
        - name: RABBITMQ__PASSWORD
          value: "guest"
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerceinventoryapi-service
spec:
  selector:
    app: ecommerceinventoryapi
  ports:
    - protocol: TCP
      port: 5003
      targetPort: 5003
  type: ClusterIP