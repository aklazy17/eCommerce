apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerceocelotapigateway-deployment
  labels:
    app: ecommerceocelotapigateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecommerceocelotapigateway
  template:
    metadata:
      labels:
        app: ecommerceocelotapigateway
    spec:
      containers:
      - name: ecommerceocelotapigateway
        image: amit728/ecommerceocelotapigateway:1.0.1
        ports:
        - containerPort: 5006
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: common-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ASPNETCORE_URLS
          value: "http://*:5006"
        - name: EUREKA__CLIENT__SERVICEURL
          valueFrom:
            configMapKeyRef:
              name: eureka-config
              key: EUREKA__CLIENT__SERVICEURL
        - name: EUREKA__CLIENT__SHOULDFETCHREGISTRY
          value: "true"
        - name: EUREKA__CLIENT__SHOULDREGISTERWITHEUREKA
          value: "false"
        - name: EUREKA__INSTANCE__APPNAME
          value: "ocelot-api-gateway"
        - name: EUREKA__INSTANCE__PORT
          value: "5006"
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerceocelotapigateway-service
spec:
  selector:
    app: ecommerceocelotapigateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5006
      nodePort: 30080
  type: NodePort